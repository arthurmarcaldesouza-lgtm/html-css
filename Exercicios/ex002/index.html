<!DOCTYPE html>
<html lang="ptp-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linhas </h1>
    <hr>
    <p>Voce pode escrever um parágrafo de qualquer jeito basta colocar tudo no meio de tags p e /p
    </p>
    <p>
    Se você precisar quebrar o texto em algum lugar especifico <br> como esse, você pode usar a tag br 
    </p>
    <p>
        Vamos adicionar alguns simbolos <br>
        &reg;
        &copy;
        &trade;
        &euro; 
        &pound;
        &yen;
        &cent;
        &Delta;
        &uparrow;
    </p>
    <p>
        Vamos adcionar emoji: <br>
       &#x1F596; <!--Emoji-->
       &#x1F913; <!--Outro emoji-->
    </p>
</body>
</html>
