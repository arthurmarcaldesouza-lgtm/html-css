<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
        }

        thead{
            background-color: gray;
            color: white;
        }

        th, td{
            border: 1px solid black;
            text-align: center;
        }

        .media{
            background-color: gray;
            color: white;
            text-align: start;
        }

        .number{
            text-align: center;
            background-color: gray;
            color: white;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Àrea</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Media</th>
            </tr>

            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matematica</td>
                <td>6.0</td>
                <td>6.0</td>
                <td>6.0</td>
            </tr>

            <tr>
                <td>Fisica</td>
                <td>6.0</td>
                <td>6.0</td>
                <td>6.0</td>
            </tr>

            <tr>
                <td>Quimica</td>
                <td>6.0</td>
                <td>6.0</td>
                <td>6.0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>6.0</td>
                <td>6.0</td>
                <td>6.0</td>
            </tr>

            <tr>
                <th class="media" colspan="4" scope="row">Media de exatas</th>
                <td class="number">6.0</td>
            </tr>

            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>6.0</td>
                <td>6.0</td>
                <td>6.0</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>6.0</td>
                <td>6.0</td>
                <td>6.0</td>
            </tr>

            <tr>
                <th class="media" colspan="4" scope="row">Media de Humanas</th>
                <td class="number">6.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
