<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em html</title>
</head>
<body>
   <h1>
    Tags em HTML
   </h1> 

   <p>
    Em html 5, podemos inserir os elementos da lista a seguir. Passe o mouse <br> sobre os termos para descobrir qual tag deve ultilizar em casa caso 
   </p>

   <ul type="square">
     <li><abbr title="Use a tag <p>">Páragrafos</abbr>
        <li><abbr title="Use a tag <h1>..<h6>">Titulos </abbr>
            <li><abbr title="Use a tag <img>">Imagens</abbr>
                <li><abbr title="Use a tag <abbr>">Abreviações</abbr> 
                    <li><abbr title="Use a tag <code>">Código-fonte</abbr>
                        <li><abbr title="Usar a tag <ol> e <li>">Listas Numeradas</abbr>
                            <li><abbr title="Use a tag <ul> e <li>">Listas com demarcadores </abbr>
   </ul>
</body>
</html>
